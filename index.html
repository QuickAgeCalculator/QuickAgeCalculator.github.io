<div class="word-counter-container">
    <h2>Advanced Word & Character Counter</h2>
    <p>अपना टेक्स्ट नीचे पेस्ट करें या टाइप करना शुरू करें:</p>
    
    <textarea id="text-input" placeholder="यहाँ अपना टेक्स्ट लिखना या पेस्ट करना शुरू करें..."></textarea>
    
    <div class="counter-button-row">
        <button onclick="clearText()" class="clear-btn">Clear Text</button>
        <button onclick="copyText()" class="copy-btn">Copy Text</button>
    </div>

    <div class="stats-grid">
        <div class="stat-box">
            <span class="stat-number" id="word-count">0</span>
            <span class="stat-label">Words</span>
        </div>
        <div class="stat-box">
            <span class="stat-number" id="char-count">0</span>
            <span class="stat-label">Characters (with space)</span>
        </div>
        <div class="stat-box">
            <span class="stat-number" id="char-no-space">0</span>
            <span class="stat-label">Characters (no space)</span>
        </div>
        <div class="stat-box">
            <span class="stat-number" id="para-count">0</span>
            <span class="stat-label">Paragraphs</span>
        </div>
    </div>
    
    <div class="reading-time">
        ⏱️ <strong>Estimated Reading Time:</strong> <span id="reading-time">0 min 0 sec</span>
    </div>
</div>

<style>
.word-counter-container {
    background: #ffffff;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    max-width: 800px;
    margin: 20px auto;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    border: 1px solid #eef2f5;
}
.word-counter-container h2 {
    color: #1a202c;
    margin-bottom: 5px;
    font-weight: 700;
}
.word-counter-container p {
    color: #718096;
    margin-bottom: 15px;
}
#text-input {
    width: 100%;
    height: 220px;
    padding: 15px;
    border: 2px solid #cbd5e0;
    border-radius: 8px;
    font-size: 16px;
    resize: vertical;
    box-sizing: border-box;
    transition: border-color 0.2s;
}
#text-input:focus {
    border-color: #3182ce;
    outline: none;
}
.counter-button-row {
    margin-top: 10px;
    display: flex;
    gap: 10px;
}
.counter-button-row button {
    padding: 8px 15px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
}
.clear-btn { background: #e53e3e; color: white; }
.clear-btn:hover { background: #c53030; }
.copy-btn { background: #3182ce; color: white; }
.copy-btn:hover { background: #2b6cb0; }

.stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    margin-top: 25px;
}
@media (min-width: 600px) {
    .stats-grid { grid-template-columns: repeat(4, 1fr); }
}
.stat-box {
    background: #f7fafc;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
    border: 1px solid #e2e8f0;
}
.stat-number {
    display: block;
    font-size: 24px;
    font-weight: 700;
    color: #2d3748;
}
.stat-label {
    font-size: 12px;
    color: #718096;
    text-transform: uppercase;
    font-weight: 600;
    letter-spacing: 0.5px;
}
.reading-time {
    margin-top: 20px;
    padding: 12px;
    background: #ebf8ff;
    border-left: 4px solid #3182ce;
    border-radius: 0 8px 8px 0;
    color: #2b6cb0;
    font-size: 15px;
}
</style>

<script>
const textInput = document.getElementById('text-input');
const wordCount = document.getElementById('word-count');
const charCount = document.getElementById('char-count');
const charNoSpace = document.getElementById('char-no-space');
const paraCount = document.getElementById('para-count');
const readingTime = document.getElementById('reading-time');

textInput.addEventListener('input', () => {
    const text = textInput.value;
    
    // Character Count (with space)
    charCount.innerText = text.length;
    
    // Character Count (no space)
    charNoSpace.innerText = text.replace(/\s/g, '').length;
    
    // Word Count
    const words = text.trim().split(/\s+/).filter(word => word.length > 0);
    wordCount.innerText = words.length;
    
    // Paragraph Count
    const paragraphs = text.split(/\n+/).filter(para => para.trim().length > 0);
    paraCount.innerText = paragraphs.length;
    
    // Reading Time (Average 200 words per minute)
    const totalSeconds = Math.floor((words.length / 200) * 60);
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    readingTime.innerText = `${minutes} min ${seconds} sec`;
});

function clearText() {
    textInput.value = '';
    textInput.dispatchEvent(new Event('input'));
}

function copyText() {
    if(textInput.value) {
        textInput.select();
        document.execCommand('copy');
        alert('Text copied to clipboard!');
    }
}
</script>
